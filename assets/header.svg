<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" role="img" aria-label="Alok Kumar Singh, Developer and Product Builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset=".55" stop-color="#1a0f38"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#A855F7"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A855F7"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7C3AED" stroke-opacity=".14"/></pattern>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
<clipPath id="r"><rect x="130" y="110" width="0" height="90"><animate attributeName="width" from="0" to="740" begin="0.9s" dur="1.6s" fill="freeze"/></rect></clipPath>
<clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1000" height="300" fill="url(#bg)"/>
<rect width="1000" height="300" fill="url(#grid)"/>
<circle cx="180" cy="80" r="110" fill="#7C3AED" opacity=".35" filter="url(#blur)"><animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="830" cy="230" r="110" fill="#22D3EE" opacity=".22" filter="url(#blur)"><animate attributeName="cx" values="830;740;830" dur="11s" repeatCount="indefinite"/></circle>
<text x="40" y="110" font-size="12" fill="#A855F7" opacity=".22">const ship = () =&gt; done &gt; perfect;<animate attributeName="y" values="110;102;110" dur="7s" repeatCount="indefinite"/></text>
<text x="690" y="96" font-size="12" fill="#A855F7" opacity=".22">while (alive) { learn(); build(); }<animate attributeName="y" values="96;88;96" dur="8s" repeatCount="indefinite"/></text>
<text x="70" y="205" font-size="12" fill="#A855F7" opacity=".22">git commit -m "quick fix (became feature)"<animate attributeName="y" values="205;197;205" dur="9s" repeatCount="indefinite"/></text>
<text x="640" y="200" font-size="12" fill="#A855F7" opacity=".22">$ rm -rf unnecessary_complexity<animate attributeName="y" values="200;192;200" dur="10s" repeatCount="indefinite"/></text>
<text x="380" y="62" font-size="12" fill="#A855F7" opacity=".22">// real problems. real users.<animate attributeName="y" values="62;54;62" dur="11s" repeatCount="indefinite"/></text>

<rect width="1000" height="2" fill="#fff" opacity=".07"><animate attributeName="y" from="0" to="300" dur="5s" repeatCount="indefinite"/></rect>
<rect width="1000" height="42" fill="#161b22" opacity=".85"/>
<circle cx="28" cy="21" r="6" fill="#FF5F56"/><circle cx="50" cy="21" r="6" fill="#FFBD2E"/><circle cx="72" cy="21" r="6" fill="#27C93F"/>
<text x="500" y="26" font-size="13" fill="#8B949E" text-anchor="middle">almostalok@github: ~</text>
<text x="972" y="26" font-size="12" fill="#8B949E" text-anchor="end">zsh</text>
<text x="500" y="98" font-size="17" fill="#4ADE80" text-anchor="middle">$ whoami<animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.4s" fill="freeze"/></text>
<g clip-path="url(#r)"><text x="500" y="178" font-size="56" font-weight="800" letter-spacing="4" text-anchor="middle" fill="url(#tx)" filter="url(#glow)">ALOK KUMAR SINGH</text></g>
<text x="500" y="217" font-size="19" fill="#C4B5FD" text-anchor="middle" opacity="0">Developer / Product Builder  ·  building <tspan fill="#A855F7" font-weight="700">Hospate</tspan><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.6s" fill="freeze"/></text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.5s" fill="freeze"/>
<rect x="273.0" y="238" width="86.0" height="30" rx="15" fill="#161b22" stroke="#22D3EE" stroke-opacity=".6"/>
<circle cx="291.0" cy="253" r="4" fill="#22D3EE"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="303.0" y="258" font-size="14" fill="#E6EDF3">India</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.85s" dur="0.5s" fill="freeze"/>
<rect x="373.0" y="238" width="161.6" height="30" rx="15" fill="#161b22" stroke="#FBBF24" stroke-opacity=".6"/>
<circle cx="391.0" cy="253" r="4" fill="#FBBF24"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="403.0" y="258" font-size="14" fill="#E6EDF3">caffeine: 100%</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.5s" fill="freeze"/>
<rect x="548.6" y="238" width="178.4" height="30" rx="15" fill="#161b22" stroke="#4ADE80" stroke-opacity=".6"/>
<circle cx="566.6" cy="253" r="4" fill="#4ADE80"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="578.6" y="258" font-size="14" fill="#E6EDF3">status: shipping</text></g>

</g>
<rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="url(#bd)" stroke-width="2"/>
</svg>